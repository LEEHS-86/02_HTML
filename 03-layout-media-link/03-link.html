<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<h1>링크 활용하기</h1>
<!-- target 을 작성하지 않으면 기본값인 _self로 동작함 -->
<a href="https://www.naver.com" target="_self">네이버로 현재 창 이동</a>
<!-- 원래 있었던 창에서 이동함 -->
<a href="https://www.naver.com" target="_black">네이버로 다른 창 이동</a>
<!-- 다른창이 생기며 이동함 -->
<a href="pahes/about.html">내 소개</a>

<a href="#contack">만 아래 연락처로 이동</a>
<!-- contack <-어디로보내는가? id가 붙어 있는곳으로 이동 -->
<h2>메일 쓰기</h2>
<a href="mailto:hello@example.com">메일 보내기</a>
<a href="tel:1588-1588">전화걸기</a>

<div style="height: 1200px;"></div>

<h2 id="contack">연락처</h2>
<p>hello@example.com</p>
<a href="#">맨위로</a>
<!-- id없이 #만 붙이면 현재 페이지 상단으로 이동 -->
</body>
</html>
