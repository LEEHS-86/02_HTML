<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>태그의 구성</title>

</head>


<body>

<!--
    <p> -> 시작 태그
    align -> 속성
    center -> 속성값
    HTML/CSS -> 내용
    </p> -> 종료 태그

    이 문장 전체는 "요소(Element)"라고 함
-->
<p align="center">HTML/css</p>

<h2>짝 태그 : 내용을 감싸서 사용하기 위한 태그</h2>
<a href="http://google.com">구글로 이동하는 태그</a>
<p><br><p>

<h2>단독 태그 : 감쌀 내용이 없음</h2>
<p>줄을 바꿀 때<br />br 태그를 사욥하니다.</p>
<p>br를 사용하지 않으면
엔터를 쳐도 줄이 바뀌지 않습니다.</p>
<hr />
<p><br><p>

<h2>태그의 중첩</h2>
<p>오늘은<strong>월요일</strong>입니다.</p>


</body>
</html>
